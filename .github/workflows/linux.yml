name: Linux build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxml2-dev libsoup-3.0-dev libjson-glib-dev libsqlite3-dev ninja-build xvfb xauth
      - run: cmake -S . -B build -G Ninja
      - run: cmake --build build
      - run: xvfb-run -a ctest --test-dir build --output-on-failure
